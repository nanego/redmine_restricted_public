<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Noto Sans, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .title { font-size: 30px; font-weight: 700; fill: #212529; }
      .h2 { font-size: 21px; font-weight: 700; fill: #212529; }
      .t { font-size: 16px; fill: #343a40; }
      .s { font-size: 14px; fill: #495057; }
      .b { font-weight: 700; }
      .mono { font-family: Noto Sans Mono, monospace; font-size: 14px; fill: #343a40; }
      .box { fill: #ffffff; stroke: #adb5bd; stroke-width: 1.5; }
      .line { stroke: #495057; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #868e96; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8f9fa"/>
  <text x="40" y="58" class="title">Restricted public projects: how they work</text>
  <text x="40" y="88" class="t">A restricted public project is public for internal users, and private for external users.</text>

  <!-- ============ LEFT: who is internal ============ -->
  <rect x="30" y="115" width="720" height="760" rx="14" fill="#e7f5ff" stroke="#74c0fc" stroke-width="1.5"/>
  <text x="55" y="150" class="h2">1. Who is internal? (redmine_internal_users)</text>

  <rect x="60" y="175" width="300" height="78" rx="10" class="box"/>
  <text x="80" y="206" class="t b">OIDC login</text>
  <text x="80" y="232" class="s">mail claim, verified by the provider</text>

  <rect x="430" y="175" width="290" height="78" rx="10" class="box"/>
  <text x="450" y="206" class="t b">Directory</text>
  <text x="450" y="232" class="s">registered by another plugin (LDAP...)</text>

  <path d="M360,214 L425,214" class="line"/>

  <rect x="60" y="300" width="660" height="118" rx="10" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="80" y="332" class="t b">Status stored on the user</text>
  <text x="80" y="360" class="mono">users.internal       true when found</text>
  <text x="80" y="383" class="mono">users.internal_mail  verified address looked up</text>
  <text x="80" y="406" class="mono">users.internal_checked_at</text>
  <path d="M575,253 L575,295" class="line"/>

  <rect x="60" y="445" width="320" height="150" rx="10" class="box"/>
  <text x="80" y="475" class="t b">Administrator override</text>
  <text x="80" y="503" class="s">Automatic, Forced: internal</text>
  <text x="80" y="524" class="s">or Forced: external.</text>
  <text x="80" y="548" class="s">A forced status always wins</text>
  <text x="80" y="569" class="s">and is never recomputed.</text>
  <text x="80" y="588" class="mono">users.internal_forced</text>

  <rect x="400" y="445" width="320" height="150" rx="10" class="box"/>
  <text x="420" y="475" class="t b">Safety</text>
  <text x="420" y="503" class="s">Password, API key logins:</text>
  <text x="420" y="527" class="s">never promote (editable addresses).</text>
  <text x="420" y="555" class="s">Directory down: status kept,</text>
  <text x="420" y="579" class="s">the login is never blocked.</text>

  <rect x="60" y="620" width="660" height="230" rx="10" class="box"/>
  <text x="80" y="652" class="t b">Scheduled task: rake redmine:internal_users:sync</text>
  <text x="80" y="684" class="s"><tspan class="b">Every night (cron)</tspan>: demotes internal users no longer in the directory.</text>
  <text x="80" y="710" class="s"><tspan class="b">SEED=1</tspan> (once, at installation): also promotes existing accounts.</text>
  <text x="80" y="736" class="s">Looks up the verified address, or else the addresses of the account.</text>
  <text x="80" y="770" class="s b">Safeguards: nothing is changed if</text>
  <text x="100" y="796" class="s">a directory query fails,</text>
  <text x="100" y="822" class="s">or more than 10% of the internal users would be demoted (unless FORCE=1).</text>

  <!-- ============ RIGHT: who sees what ============ -->
  <rect x="780" y="115" width="790" height="760" rx="14" fill="#fff9db" stroke="#fcc419" stroke-width="1.5"/>
  <text x="805" y="150" class="h2">2. Who sees what? (redmine_restricted_public)</text>

  <text x="805" y="185" class="s">Choice on the project form (permission "Select project publicity"):</text>
  <g>
    <circle cx="815" cy="208" r="7" fill="none" stroke="#495057" stroke-width="1.5"/>
    <text x="830" y="213" class="t">Public</text>
    <circle cx="915" cy="208" r="7" fill="none" stroke="#495057" stroke-width="1.5"/>
    <circle cx="915" cy="208" r="3.5" fill="#495057"/>
    <text x="930" y="213" class="t">Restricted public (internal users only)</text>
    <circle cx="1283" cy="208" r="7" fill="none" stroke="#495057" stroke-width="1.5"/>
    <text x="1298" y="213" class="t">Private</text>
  </g>

  <g transform="translate(805,240)">
    <rect x="0" y="0" width="740" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
    <rect x="0" y="0" width="740" height="56" rx="10" fill="#f1f3f5"/>
    <rect x="0" y="40" width="740" height="16" fill="#f1f3f5"/>
    <text x="20" y="34" class="s b">User</text>
    <text x="250" y="34" class="t b">Public</text>
    <text x="410" y="34" class="t b">Restricted public</text>
    <text x="600" y="34" class="t b">Private</text>
    <line x1="230" y1="0" x2="230" y2="330" stroke="#dee2e6"/>
    <line x1="390" y1="0" x2="390" y2="330" stroke="#dee2e6"/>
    <line x1="580" y1="0" x2="580" y2="330" stroke="#dee2e6"/>

    <line x1="0" y1="56" x2="740" y2="56" stroke="#dee2e6"/>
    <text x="20" y="94" class="t b">Internal</text>
    <text x="20" y="116" class="s">not a member</text>
    <rect x="240" y="66" width="140" height="70" rx="8" fill="#d3f9d8"/>
    <text x="310" y="96" class="t b" text-anchor="middle" fill="#2b8a3e">visible</text>
    <text x="310" y="120" class="s" text-anchor="middle">Non member role</text>
    <rect x="400" y="66" width="170" height="70" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
    <text x="485" y="96" class="t b" text-anchor="middle" fill="#2b8a3e">visible</text>
    <text x="485" y="120" class="s" text-anchor="middle">like a public one</text>
    <rect x="590" y="66" width="140" height="70" rx="8" fill="#ffe3e3"/>
    <text x="660" y="106" class="t b" text-anchor="middle" fill="#c92a2a">hidden</text>

    <line x1="0" y1="146" x2="740" y2="146" stroke="#dee2e6"/>
    <text x="20" y="184" class="t b">External</text>
    <text x="20" y="206" class="s">not a member</text>
    <rect x="240" y="156" width="140" height="70" rx="8" fill="#d3f9d8"/>
    <text x="310" y="186" class="t b" text-anchor="middle" fill="#2b8a3e">visible</text>
    <text x="310" y="210" class="s" text-anchor="middle">Non member role</text>
    <rect x="400" y="156" width="170" height="70" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
    <text x="485" y="186" class="t b" text-anchor="middle" fill="#c92a2a">hidden</text>
    <text x="485" y="210" class="s" text-anchor="middle">like a private one</text>
    <rect x="590" y="156" width="140" height="70" rx="8" fill="#ffe3e3"/>
    <text x="660" y="196" class="t b" text-anchor="middle" fill="#c92a2a">hidden</text>

    <line x1="0" y1="236" x2="740" y2="236" stroke="#dee2e6"/>
    <text x="20" y="274" class="t b">Member</text>
    <text x="20" y="296" class="s">internal or external</text>
    <rect x="240" y="246" width="490" height="74" rx="8" fill="#e7f5ff"/>
    <text x="485" y="278" class="t b" text-anchor="middle" fill="#1864ab">roles of the membership</text>
    <text x="485" y="302" class="s" text-anchor="middle">unchanged, whatever the mode</text>
  </g>

  <text x="805" y="605" class="s">The roles given to the non-member group on the project also apply to internal</text>
  <text x="805" y="627" class="s">users, as on a public project. Anonymous users never see it.</text>

  <rect x="805" y="650" width="740" height="200" rx="10" fill="#ffffff" stroke="#e67700" stroke-width="2"/>
  <text x="825" y="682" class="t b">Fail-closed storage</text>
  <text x="825" y="712" class="mono">Public             is_public = true   restricted_public = false</text>
  <text x="825" y="736" class="mono">Restricted public  is_public = false  restricted_public = true</text>
  <text x="825" y="760" class="mono">Private            is_public = false  restricted_public = false</text>
  <text x="825" y="794" class="s">Any code unaware of this mode (other plugins, API, news notifications)</text>
  <text x="825" y="818" class="s">treats it as private: external users can never be given access by mistake.</text>
  <text x="825" y="842" class="s">Making a project public always clears restricted_public.</text>

  <path d="M720,360 C760,360 760,315 800,315" class="dash"/>

  <rect x="30" y="900" width="1540" height="110" rx="14" fill="#f1f3f5" stroke="#ced4da" stroke-width="1.5"/>
  <text x="55" y="932" class="t b">Under the hood</text>
  <text x="55" y="960" class="s">SQL (lists, search, API): Project.public_projects_condition(user), an extension point of redmine_organizations,</text>
  <text x="55" y="982" class="s">returns "is_public OR restricted_public" for an internal user. Ruby (direct access): User#allowed_to?, #roles_for_project, #project_ids_by_role.</text>
  <text x="55" y="1002" class="s">Both paths give the same results.</text>
</svg>
